# RustLauncher configuration
# Edit these values, no rebuild needed. Lines starting with # or ; are ignored.

# Direct link to the client .zip the launcher downloads.
# Must be a DIRECT download link (not a "preview" page).
DownloadUrl=https://cdn.rustorigin.com/RustClient-2021-04.zip

# Expected SHA-256 of RustClient.zip (integrity verification). REQUIRED.
# The launcher hashes the finished download and REJECTS it (never extracts or launches it)
# unless the hash matches. If this is blank, Install is blocked entirely - the launcher
# refuses to download or install anything it cannot verify.
# Get the value from package_client.ps1 output, or:  certutil -hashfile RustClient.zip SHA256
# A "sha256:" prefix, spaces and dashes are tolerated; case does not matter.
Sha256=c71f0b49e4620cc6704765028286edbc98a17b6a9aa4734ad61147443fee4106

# Exact size in bytes of that same zip (package_client.ps1 prints it). Optional but recommended: a download
# server announcing another size is refused before anything is downloaded, and the launcher never downloads
# or reserves more than this. A wrong value blocks every install, so copy it from the script output.
ClientSize=11273065049

# Where the client is installed. Leave blank to use ".\Rust" next to the launcher.
# No admin rights needed for a top-level folder like this (Program Files would need them).
InstallDir=C:\Rustorigin

# Executable the Play button launches (searched inside InstallDir).
LaunchExe=RustClient.exe

# Optional launch arguments, e.g. -console +connect 127.0.0.1:28015
LaunchArgs=

# Parallel connections used to download the client (1-16). Several connections at once are much
# faster for players whose ISP limits each connection. 1 = a single connection (the old behavior).
# Needs a server that honors HTTP Range; the launcher falls back to 1 automatically if it doesn't.
DownloadConnections=6

# Client build that DownloadUrl serves. The launcher records it in the install; an install that
# records a different build - or none, i.e. every install made before launcher 1.1 - is outdated
# and shows UPDATE instead of PLAY. Change it whenever DownloadUrl/Sha256 move to a new build.
# Blank disables update detection.
ClientVersion=2021-04

# Delta pack (optional): lets players on the PREVIOUS build update by downloading only the data
# they don't already have, instead of the whole client. Build it with scripts\make_client_patch.ps1,
# which prints all three values. PatchSha256 is REQUIRED for the pack to be used - it is verified
# exactly like the client zip, every file rebuilt from it is verified again, and anything that
# doesn't match falls back to the full download above. PatchProbe is "relative\path|size" of a
# file in the previous build, checked before the pack is downloaded.
PatchUrl=https://cdn.rustorigin.com/RustClient-2021-01-to-2021-04.patchpack
PatchSha256=3a9d9325335ed91e8a69db97ff1f1ded8aab20addf3d3eb2bd2de0f4374dbc67
PatchProbe=GameAssembly.dll|43225944
# Exact size in bytes of the pack (make_client_patch.ps1 prints it). Optional, like ClientSize.
PatchSize=1548242371

# Launcher self-update: owner/repo whose GitHub Releases are checked on launch. If a newer
# release exists AND its SHA256SUMS.txt is signed with the release key below, the launcher downloads
# the new RustoriginLauncher.exe, verifies it against those signed sums, and swaps itself out. Needs a
# PUBLIC repo (unauthenticated GitHub API). Updates are MANDATORY: the check runs every launch and the
# launcher refuses to start on an outdated version (players cannot turn it off). Blank disables it.
UpdateRepo=RUSTORIGIN/launcher

# Public half of the offline release signing key (scripts\new_signing_key.ps1 prints this line). Only
# releases signed with it (scripts\sign_release.ps1) are installed. Blank = this launcher never updates
# itself - and the release workflow refuses to build a release without it. Taken only from the config
# embedded in the exe, never from a launcher.cfg next to it.
UpdatePublicKey=

# Discord Rich Presence (optional). Create an application at
# https://discord.com/developers/applications, copy its Application ID into DiscordAppId, and
# (optionally) upload a Rich Presence art asset and put its key in DiscordLargeImage. Shows
# "RUSTORIGIN - In the launcher / In game" on the player's Discord profile. Blank = disabled.
DiscordAppId=1549994464410472459
DiscordLargeImage=
# Optional clickable button shown under the Rich Presence (links out to your site).
DiscordButtonLabel=Play on Rustorigin
DiscordButtonUrl=https://rustorigin.com

# Launcher anti-cheat session (docs/CLIENT_ANTICHEAT.md): the launcher opens a session when the game
# starts and heartbeats while it runs, so the server can see who plays without the launcher. Must be
# https. Blank = off (none of the lines below are used then). It never blocks PLAY.
AcSessionUrl=
# Evidence labels sent with the heartbeats - only labels leave the PC, never a process list. The list of
# tools to look for is NOT here: the session service sends it with each session (private, server-side).
# AcClientFile=path|size|sha256 -> "client:modified:<file>" / "client:missing:<file>" when an installed
# game file differs from the hosted build. Regenerate with scripts\make_client_filehashes.ps1 whenever
# the client build changes (these are the 2021-04 build).
AcClientFile=GameAssembly.dll|52040536|bfc384245544633c0ccde9a66e793b788f49abf9dae1ebe1d9ef8e654664979c
AcClientFile=UnityPlayer.dll|25985880|766ab725272a81d7f2743976f8262bfb290854de037dd49e856e1411112294b8
AcClientFile=RustClient_Data\il2cpp_data\Metadata\global-metadata.dat|12144316|52fc1d4b4a03c2b870a783cc3793d7b0d5a9d61da1a60850e5f2f8c48f8fdc08

# Optional version label shown in the launcher.
Version=Apr 2021

# Big title shown in the launcher (the hero text).
Title=RUSTORIGIN

# Description line under the title.
Tagline=Rustorigin is a private Rust world on the April 2021 build. Craft, raid and survive with a tight community - one click to jump in.

# Background is a cross-fading slideshow of the screenshots assets/1.jpg .. 3.jpg (embedded in
# the exe). Swap those images and rebuild to change it. The slideshow is always on (no toggle).

# Player name shown in the top-right user pill.
Player=White Pegasus

# Server cards (right column, up to 6). Format:  Server=Tag|Name|launch args|players|cover
# All fields after Name are optional. "cover" is an embedded image file name (e.g. main.png)
# used as the card background; leave it blank for the default gradient.
#
# LIVE STATUS: the card shows a live green/red dot + "players/max" (refreshed every ~60s),
# replacing the static "players" field. Two sources, in priority order:
#   1) A2S over "+connect HOST:PORT" in the launch args - PREFERRED. Works now that the server
#      runs the real Steam API (it answers A2S on its public IP), so no website is needed.
#   2) statusUrl (6th field) - a website stats-feed URL, used only if set. Fallback for any server
#      that can't answer A2S (e.g. one left on the Goldberg emulator). The URL must return the
#      OriginStatsPublisher payload for ONE server (top-level "server" block with
#      "players"/"maxPlayers"), or a slim {"players":N,"maxPlayers":N}.
# Without either, the card just shows the static "players" text.
# Format:  Server=Tag|Name|launch args|players|cover|statusUrl   (all but Name optional)
Server=Training, Aim, Old Recoil|Training Grounds|-console +connect 51.195.60.227:28015||train.png
Server=Vanilla, Main, Old Recoil|Rustorigin Main|||main.png

# Social links (top-left icons). Format:  Social=platform|url
# Supported platforms (brand icons built in): discord, youtube, tiktok.
# Replace the placeholder URLs below with the real ones; delete a line to hide that icon.
Social=discord|https://discord.gg/rustorigin
Social=tiktok|https://www.tiktok.com/@rustorigin
Social=youtube|https://www.youtube.com/@RUSTORIGlN

