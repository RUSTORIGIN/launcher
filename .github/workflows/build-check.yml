# Fast build check: compiles both builds on every push/PR so breakage is caught early.
# It does NOT build the installers (that is the release workflow's job) and produces no release.
# It runs on doc-only changes too: `compile` is a required check (.github/rulesets/protect-main.json), so a
# paths-ignore would leave such a PR waiting on a check that never runs.
name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false

      - name: Build launcher (compile + embed) via make_release.ps1
        shell: pwsh
        run: |
          .\scripts\make_release.ps1 -Version 0.0.0
          if (-not (Test-Path 'release\RustoriginLauncher.exe')) { throw 'RustoriginLauncher.exe was not produced' }
          Write-Host 'RustoriginLauncher.exe built OK'

      - name: Test updater parsing
        shell: pwsh
        run: .\scripts\test_updater_parsing.ps1

      - name: Test A2S server-status parsing
        shell: pwsh
        run: .\scripts\test_a2s_parsing.ps1

      - name: Test client delta update (build a pack, apply it, verify)
        shell: pwsh
        run: .\scripts\test_client_patch.ps1

      - name: Test anti-cheat session protocol helpers
        shell: pwsh
        run: .\scripts\test_ac_session.ps1

      - name: Test install-folder link checks (junctions)
        shell: pwsh
        run: .\scripts\test_folder_pin.ps1

      - name: Test install-folder lock (release exe --secure-folder)
        shell: pwsh
        run: .\scripts\test_folder_lock.ps1
